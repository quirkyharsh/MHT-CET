<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Cutoff Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 48px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 480px;
        }
        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        a.button {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a.button:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>MHT-CET College Cutoff Predictor</h1>
        <p>Pick a college, branch, category, and score type to estimate the minimum percentile you'd need for admission.</p>
        <a class="button" href="/predictdata">Get Started</a>
    </div>
</body>
</html>
